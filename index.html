<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poort8 Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Poort8 Docs - Docs for Poort8 products and dataspaces.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <style>
    likec4-view.likec4-embed {
      display: block;
      min-height: 720px;
      border: 1px solid #d7deea;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js"></script>
  <script>
    var num = 0;
    var mermaidSources = {};
    mermaid.initialize({ startOnLoad: false });

    function installLikeC4OverlayFix(host) {
      if (!host || host.dataset.p8Likec4Fixed === 'true') {
        return false;
      }

      var outerShadowRoot = host.shadowRoot;
      var innerHost = outerShadowRoot && outerShadowRoot.querySelector('.likec4-view');
      var innerShadowRoot = innerHost && innerHost.shadowRoot;

      if (!innerShadowRoot) {
        return false;
      }

      if (!innerShadowRoot.querySelector('style[data-p8-likec4-overlay-fix]')) {
        var style = document.createElement('style');
        style.setAttribute('data-p8-likec4-overlay-fix', 'true');
        style.textContent = [
          'dialog.likec4-overlay.likec4-overlay--fullscreen_false {',
          '  position: fixed !important;',
          '  top: 50% !important;',
          '  left: 50% !important;',
          '  transform: translate(-50%, -50%) !important;',
          '  width: min(calc(100vw - 2rem), 1080px) !important;',
          '  height: min(calc(100vh - 2rem), 720px) !important;',
          '  margin: 0 !important;',
          '  padding: 0 !important;',
          '  background: #fff !important;',
          '  border-radius: 12px !important;',
          '  overflow: hidden !important;',
          '}',
          'dialog.likec4-overlay.likec4-overlay--fullscreen_false::backdrop {',
          '  background: rgba(15, 23, 42, 0.72) !important;',
          '}',
          'dialog.likec4-overlay .likec4-overlay-body {',
          '  background: #fff !important;',
          '}',
          'dialog.likec4-overlay .likec4-shadow-root {',
          '  background: #fff !important;',
          '}'
        ].join('\n');
        innerShadowRoot.appendChild(style);
      }

      host.dataset.p8Likec4Fixed = 'true';
      return true;
    }

    function applyLikeC4OverlayFix() {
      var hosts = document.querySelectorAll('likec4-view');
      if (!hosts.length) {
        return;
      }

      // Wait for the custom element to be defined (handles dynamic bundle loading).
      // After definition, the inner shadow DOM may still need a frame to render,
      // so we keep a short rAF fallback for each host.
      customElements.whenDefined('likec4-view').then(function() {
        hosts.forEach(function(host) {
          if (installLikeC4OverlayFix(host)) {
            return;
          }

          var attempts = 0;
          var retry = function() {
            if (installLikeC4OverlayFix(host) || attempts++ >= 5) {
              return;
            }
            window.requestAnimationFrame(retry);
          };

          window.requestAnimationFrame(retry);
        });
      });
    }

    window.$docsify = {
      name: 'Poort8 Docs',
      loadSidebar: true,
      relativePath: true,
      alias: {
        // Minimal aliases for SPA navigation within Docsify
        '/keyper/implementations/dvu/': '/dvu/',
        '/keyper/implementations/dvu/index': '/dvu/',
        '/keyper/implementations/dvu/context': '/dvu/single-building',
        '/keyper/implementations/dvu/gebouwen-in-bulk': '/dvu/bulk-buildings'
      },
      markdown: {
        renderer: {
          code: function(token) {
            var code = token.text;
            var lang = token.lang;
            if (lang === "mermaid") {
              var mermaidId = 'mermaid-svg-' + num++;
              mermaidSources[mermaidId] = code;
              return '<div class="mermaid" data-mermaid-id="' + mermaidId + '"></div>';
            }
            if (lang === "likec4") {
              // Allow explicit view selection via first-line directive: // view: <id>
              var directiveMatch = code.match(/^\/\/ view:\s*(\w+)/);
              var viewId;
              if (directiveMatch) {
                viewId = directiveMatch[1];
              } else {
                var autoMatch = code.match(/\bview\s+(\w+)/);
                if (!autoMatch) return this.origin.code.call(this, token);
                viewId = autoMatch[1];
              }
              return '<likec4-view class="likec4-embed" view-id="' + viewId + '" dynamic-variant="sequence"></likec4-view>';
            }
            return this.origin.code.call(this, token);
          }
        }
      },
      plugins: [
        function(hook) {
          var loadedBundles = {};

          function loadBundleForRoute(route) {
            if (!document.querySelector('likec4-view')) return;

            // Derive the docs section from the Docsify hash (e.g. /#/noodlebar/page -> noodlebar)
            // and load the bundle generated for that section.
            var match = (route || '').match(/#\/?([^/?#]+)(?:\/|$)/);
            if (!match) return;
            var section = match[1];
            if (!/^[a-zA-Z0-9_-]+$/.test(section)) return;
            if (!loadedBundles[section]) {
              import('./assets/js/' + section + '-components.js').then(function() {
                loadedBundles[section] = true;
              }).catch(function() {
                // No LikeC4 bundle for this section — that's fine
              });
            }
          }

          hook.doneEach(function() {
            document.querySelectorAll('[data-mermaid-id]').forEach(function(container) {
              var mermaidId = container.getAttribute('data-mermaid-id');
              var source = mermaidSources[mermaidId];
              if (!source || container.dataset.mermaidRendered === 'true') return;
              container.dataset.mermaidRendered = 'true';
              mermaid.render(mermaidId, source, function(svg) {
                container.innerHTML = svg;
              });
            });
            loadBundleForRoute(window.location.hash || '/');
            applyLikeC4OverlayFix();
          });
        }
      ]
    }
  </script>
  <!-- Docsify v5 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
</body>
</html>
